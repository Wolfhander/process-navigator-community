name: Offline release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag explicitly requested by the project owner
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-offline-package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate requested release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw 'Expected an explicit version tag.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend/process-navigator-ui
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed.' }
      - name: Build autonomous package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          .\tools\build-offline-release.ps1 -Version $version -SkipDependencyInstall
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $notes = "docs/release-notes/$version.md"
          $flags = @("--title", "Process Navigator $env:RELEASE_TAG", "--prerelease", "--verify-tag")
          if (Test-Path $notes) { $flags += @("--notes-file", $notes) }
          else { $flags += "--generate-notes" }
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw "Expected ZIP and SHA256 assets, found $($assets.Count)." }
          gh release create $env:RELEASE_TAG $assets @flags
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
