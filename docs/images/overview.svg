<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc"><title id="title">Process Navigator</title><desc id="desc">Карта процесса, действие, документ и результат связаны в одном рабочем пространстве.</desc><rect width="1000" height="280" rx="24" fill="#edf4ee"/><text x="45" y="67" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#214e3b">Process Navigator</text><text x="45" y="105" font-family="Arial,sans-serif" font-size="17" fill="#52665b">От общей карты — к понятному действию и проверяемому результату</text><g fill="#fff" stroke="#42785d" stroke-width="2"><circle cx="70" cy="190" r="20"/><rect x="140" y="155" width="190" height="70" rx="12"/><rect x="400" y="155" width="190" height="70" rx="12"/><rect x="660" y="155" width="190" height="70" rx="12"/><circle cx="925" cy="190" r="21"/><circle cx="925" cy="190" r="16"/></g><g fill="none" stroke="#42785d" stroke-width="2"><path d="M90 190h50m190 0h70m190 0h70m190 0h54"/></g><g fill="#214e3b" text-anchor="middle" font-family="Arial,sans-serif" font-size="18"><text x="235" y="197">Процесс</text><text x="495" y="197">Действие</text><text x="755" y="197">Документ</text></g></svg>
